# Lets Prometheus scrape the website's /metrics so Grafana can graph the app.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: storyteller-web
  namespace: story
  labels: { release: monitoring }
spec:
  selector: { matchLabels: { app: web } }
  endpoints:
    - { port: http, path: /metrics, interval: 15s }
